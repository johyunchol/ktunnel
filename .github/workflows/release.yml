name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be an exact stable vMAJOR.MINOR.PATCH version" >&2
            exit 1
          fi

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: auto
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            for bin in ktunnel ktunneld; do
              GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=$VERSION" \
                -o "dist/${bin}-${os}-${arch}${ext}" ./cmd/$bin
            done
          done

      - name: Build wheels
        run: |
          python3 packaging/build_wheels.py "${GITHUB_REF_NAME#v}"
          mv dist/wheels/*.whl dist/
          rmdir dist/wheels
          (cd dist && sha256sum * > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
