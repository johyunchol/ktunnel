<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#132238"><title>{{.Title}} · ktunnel</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head>
<body class="{{if .CSRF}}app-shell{{else}}auth-shell{{end}}"><a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
{{if .CSRF}}<aside class="sidebar"><a href="{{if .IsAdmin}}/{{else}}/me{{end}}" class="brand" aria-label="ktunnel 홈"><svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true"><path d="M8 10h8a5 5 0 0 1 5 5v6a5 5 0 0 0 5 5h2"></path><circle cx="7" cy="10" r="3"></circle><circle cx="29" cy="26" r="3"></circle><circle cx="21" cy="18" r="2"></circle></svg><span>ktunnel</span></a>
<nav class="primary-nav" aria-label="주요 메뉴">{{if .IsAdmin}}<a href="/" {{if eq .Path "/"}}class="on" aria-current="page"{{end}}><span>현황</span></a><a href="/users" {{if hasPrefix .Path "/users"}}class="on" aria-current="page"{{end}}><span>사용자</span></a><a href="/audit" {{if eq .Path "/audit"}}class="on" aria-current="page"{{end}}><span>감사 로그</span></a><a href="/settings" {{if eq .Path "/settings"}}class="on" aria-current="page"{{end}}><span>설정</span></a>{{else}}<a href="/me" {{if eq .Path "/me"}}class="on" aria-current="page"{{end}}><span>내 터널</span></a><a href="/account" {{if eq .Path "/account"}}class="on" aria-current="page"{{end}}><span>계정 설정</span></a>{{end}}</nav>
<div class="sidebar-foot"><div class="control-status"><span aria-hidden="true"></span><div><b>{{.Username}}</b><small>{{if .IsAdmin}}관리자{{else}}사용자{{end}}</small></div></div><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="nav-signout" type="submit"><span>로그아웃</span></button></form></div></aside>{{end}}
<div class="page-frame"><main id="main-content">{{if .Msg}}<div class="flash ok" role="status"><span aria-hidden="true">✓</span>{{.Msg}}</div>{{end}}{{if .Error}}<div class="flash err" role="alert"><span aria-hidden="true">!</span>{{.Error}}</div>{{end}}{{template "content" .}}</main></div></body></html>
