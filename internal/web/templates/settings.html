{{define "content"}}<header class="page-header"><div><h1>설정</h1><p>관리자 계정과 포털 접근을 보호합니다.</p></div></header><div class="settings-layout"><form method="post" action="/settings/password" class="card settings-card"><input type="hidden" name="csrf" value="{{.CSRF}}"><div class="card-heading"><div><h2>관리자 비밀번호 변경</h2><p>8자 이상이며 다른 서비스에서 사용하지 않는 비밀번호를 권장합니다.</p></div></div><div class="stack-form"><label for="current-password">현재 비밀번호</label><input id="current-password" type="password" name="current_password" required autocomplete="current-password"><label for="new-password">새 비밀번호</label><input id="new-password" type="password" name="new_password" required minlength="8" autocomplete="new-password"><label for="confirm-password">새 비밀번호 확인</label><input id="confirm-password" type="password" name="confirm_password" required minlength="8" autocomplete="new-password"><button>비밀번호 변경</button></div></form><aside class="security-note"><h2>변경 후 적용 사항</h2><ul><li><span>✓</span><div><b>관리자 세션 로그아웃</b><p>모든 관리자 웹 세션이 즉시 종료됩니다.</p></div></li><li><span>✓</span><div><b>터널은 그대로 유지</b><p>사용자 토큰과 실행 중인 터널에는 영향이 없습니다.</p></div></li></ul></aside></div>{{end}}
