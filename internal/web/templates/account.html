{{define "content"}}<header class="page-header"><div><h1>계정 설정</h1><p>{{.Username}} 계정의 비밀번호를 변경합니다.</p></div></header>{{if .MustChange}}<div class="flash err" role="alert">임시 비밀번호를 새 비밀번호로 변경해야 터널 메뉴를 이용할 수 있습니다.</div>{{end}}<div class="settings-layout"><form method="post" action="/account/password" class="card settings-card"><input type="hidden" name="csrf" value="{{.CSRF}}"><div class="card-heading"><div><h2>비밀번호 변경</h2><p>8자 이상의 새 비밀번호를 사용하세요.</p></div></div><div class="stack-form"><label for="current-password">현재 비밀번호</label><input id="current-password" type="password" name="current_password" required autocomplete="current-password"><label for="new-password">새 비밀번호</label><input id="new-password" type="password" name="new_password" required minlength="8" autocomplete="new-password"><label for="confirm-password">새 비밀번호 확인</label><input id="confirm-password" type="password" name="confirm_password" required minlength="8" autocomplete="new-password"><button>비밀번호 변경</button></div></form><aside class="security-note"><h2>안내</h2><ul><li><span>✓</span><div><b>웹 세션만 종료</b><p>변경 후 새 비밀번호로 다시 로그인합니다.</p></div></li><li><span>✓</span><div><b>터널 토큰 유지</b><p>발급한 토큰과 실행 중인 터널은 그대로 유지됩니다.</p></div></li></ul></aside></div>{{end}}
