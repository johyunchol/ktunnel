# Wildcard vhost: send every *unregistered* subdomain to frps.
#
# nginx matches exact server_name before wildcards, so existing hosts
# (git.example.com, ci.example.com, ...) keep their own server blocks and are
# unaffected. Only names nothing else claims land here.
#
# Requires a wildcard certificate (*.example.com) — see server/README.md.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }
}
