# Exact-hostname vhost for the ktunneld dashboard. Register it the same way as
# the wildcard block (synow3tool on DSM, or drop into sites-enabled elsewhere).
#
# Do NOT publish the dashboard through the tunnel itself: frps's vhost proxy
# rewrites X-Forwarded-Proto to "http", so the session cookie would never get
# the Secure flag, and the admin UI would depend on the very thing it manages.
# An exact server_name beats the wildcard, so this block wins for its host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tunnel-admin.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:7600;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Overwrite, never append: ktunneld keys its login lockout on X-Real-IP,
        # and an appended X-Forwarded-For would let the client pick the key.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
