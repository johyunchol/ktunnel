# Exact-hostname vhost for the ktunnel portal. Register it the same way as
# the wildcard block (synow3tool on DSM, or drop into sites-enabled elsewhere).
#
# Do NOT publish the dashboard through the tunnel itself: the portal trusts
# forwarding headers only from its dedicated loopback TLS proxy, and the admin
# UI must not depend on the very relay components it manages.
# An exact server_name beats the wildcard, so this block wins for its host.

# Redirect only the two known HTTP hostnames. Do not use $host here: reflecting
# an attacker-supplied Host header would turn this listener into an open redirect.
server {
    listen 80;
    listen [::]:80;
    server_name ktunnel.kkensu.com tunnel-admin.kkensu.com;

    return 308 https://ktunnel.kkensu.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ktunnel.kkensu.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    # This is deliberately host-only. The sibling wildcard hosts contain
    # user-published services and must not inherit the portal's HSTS policy.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:7600;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Overwrite, never append: ktunneld keys its login lockout on X-Real-IP,
        # and an appended X-Forwarded-For would let the client pick the key.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}

# Keep old bookmarks working without serving a second copy of the login page.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tunnel-admin.kkensu.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    return 308 https://ktunnel.kkensu.com$request_uri;
}

# Install one global catch-all per nginx instance if the platform does not
# already provide one. Keep it separate from the registered DSM site to avoid
# duplicate default_server declarations:
#
# server {
#     listen 80 default_server;
#     listen [::]:80 default_server;
#     server_name _;
#     return 444;
# }
# server {
#     listen 443 default_server ssl;
#     listen [::]:443 default_server ssl;
#     ssl_reject_handshake on;
# }
#
# On nginx versions without ssl_reject_handshake, configure a non-sensitive
# fallback certificate in the TLS catch-all and return 444. Never proxy an
# unknown Host to ktunneld or interpolate $host into a redirect target.
